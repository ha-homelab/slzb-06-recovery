<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="uart-ownership-title uart-ownership-desc" id="uart-ownership-root">
<title id="uart-ownership-title">Keep text logs out of the binary flash session</title>
<desc id="uart-ownership-desc">The ESP8266 UART switches between USB console, JN5169 application logs and exclusive JN5169 bootloader traffic; a completed or failed session returns to logging.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #uart-ownership-root { color: #2d3142; font-family: 'Geist', Arial, sans-serif; }
      #uart-ownership-root .name { font: 600 12px 'Geist', Arial, sans-serif; fill: #2d3142; }
      #uart-ownership-root .copy { font: 400 12px 'Geist', Arial, sans-serif; fill: #4f5d75; }
      #uart-ownership-root .mono { font: 400 9px 'Geist Mono', 'Courier New', monospace; fill: #4f5d75; }
      #uart-ownership-root .tag { font: 500 8px 'Geist Mono', 'Courier New', monospace; letter-spacing: 1px; fill: #4f5d75; }
      #uart-ownership-root .label { font: 400 8px 'Geist Mono', 'Courier New', monospace; letter-spacing: .48px; fill: #4f5d75; }
      #uart-ownership-root .title { font: 400 28px 'Instrument Serif', Georgia, serif; fill: #2d3142; }
      #uart-ownership-root .note { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4f5d75; }</style>
<marker id="uart-ownership-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#4f5d75"/></marker>
<marker id="uart-ownership-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2e5aa8"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" rx="0" fill="#f5f5f5" stroke="none" />
<text x="40" y="32" class="tag" text-anchor="start">HELLO ZIGBEE WORLD / FIELD GUIDE</text>
<text x="40" y="76" class="title" text-anchor="start">Keep text logs out of the binary flash session</text>
<text x="40" y="104" class="copy" text-anchor="start">Simplified UART roles from the author&#x27;s implementation; recovery is not a guarantee of a bootable target.</text>
<line x1="264" y1="280" x2="376" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uart-ownership-arrow)"/>
<line x1="584" y1="280" x2="704" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uart-ownership-arrow)"/>
<path d="M 804 352 V 432 Q 804 440 796 440 H 488 Q 480 440 480 432 V 352" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#uart-ownership-arrow)"/>
<rect x="272" y="252" width="96" height="20" rx="2" fill="#f5f5f5" stroke="none" />
<text x="320.0" y="265" class="label" text-anchor="middle">NETWORK READY</text>
<rect x="590" y="252" width="108" height="20" rx="2" fill="#f5f5f5" stroke="none" />
<text x="644.0" y="265" class="label" text-anchor="middle">FLASH REQUEST</text>
<rect x="588" y="412" width="112" height="20" rx="2" fill="#f5f5f5" stroke="none" />
<text x="644.0" y="425" class="label" text-anchor="middle">SESSION ENDS</text>
<rect x="56" y="224" width="208" height="128" rx="8" fill="#eaeaec" stroke="#4f5d75" />
<text x="72" y="248" class="tag" text-anchor="start">STARTUP / FAULT</text>
<text x="72" y="276" class="name" text-anchor="start">USB console</text>
<text x="72" y="300" class="mono" text-anchor="start">115200 baud</text>
<text x="72" y="316" class="mono" text-anchor="start">Configure network / retry</text>
<rect x="376" y="224" width="208" height="128" rx="8" fill="#eaeaec" stroke="#4f5d75" />
<text x="392" y="248" class="tag" text-anchor="start">APPLICATION</text>
<text x="392" y="276" class="name" text-anchor="start">Target logging</text>
<text x="392" y="300" class="mono" text-anchor="start">115200 baud</text>
<text x="392" y="316" class="mono" text-anchor="start">UART lock per line / timeout</text>
<rect x="704" y="224" width="200" height="128" rx="6" fill="#f4eae4" stroke="#eb6c36" />
<text x="720" y="248" class="tag" text-anchor="start">BOOTLOADER</text>
<text x="720" y="276" class="name" text-anchor="start">Target flashing</text>
<text x="720" y="300" class="mono" text-anchor="start">38400 baud</text>
<text x="720" y="316" class="mono" text-anchor="start">UART lock for full session</text>
<text x="56" y="188" class="copy" text-anchor="start">One physical UART, one owner at a time.</text>
<text x="476" y="476" class="mono" text-anchor="start">Release UART; reset target into its application.</text>
<text x="56" y="512" class="note" text-anchor="start">Unhandled faults restore the USB console and reboot the bridge. Startup also resets the target.</text>
<line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1.2"/>
<text x="40" y="576" class="tag" text-anchor="start">KEY</text>
<rect x="108" y="562" width="16" height="16" rx="2" fill="#f4eae4" stroke="#eb6c36" />
<text x="136" y="576" class="mono" text-anchor="start">Text logger suspended</text>
<line x1="408" y1="572" x2="440" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uart-ownership-arrow)"/>
<text x="452" y="576" class="mono" text-anchor="start">Normal transition</text>
<line x1="680" y1="572" x2="712" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#uart-ownership-arrow)" stroke-dasharray="5,4"/>
<text x="724" y="576" class="mono" text-anchor="start">Return to logging</text>
</svg>
