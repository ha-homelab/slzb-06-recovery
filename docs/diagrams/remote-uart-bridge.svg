<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="remote-uart-bridge-title remote-uart-bridge-desc" id="remote-uart-bridge-root">
<title id="remote-uart-bridge-title">Remote access needs a second controller</title>
<desc id="remote-uart-bridge-desc">In the author&#x27;s NXP setup, an ESP8266 forwards logs to a host and accepts flashing requests, while GPIO signals select the JN5169 boot mode.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #remote-uart-bridge-root { color: #2d3142; font-family: 'Geist', Arial, sans-serif; }
      #remote-uart-bridge-root .name { font: 600 12px 'Geist', Arial, sans-serif; fill: #2d3142; }
      #remote-uart-bridge-root .copy { font: 400 12px 'Geist', Arial, sans-serif; fill: #4f5d75; }
      #remote-uart-bridge-root .mono { font: 400 9px 'Geist Mono', 'Courier New', monospace; fill: #4f5d75; }
      #remote-uart-bridge-root .tag { font: 500 8px 'Geist Mono', 'Courier New', monospace; letter-spacing: 1px; fill: #4f5d75; }
      #remote-uart-bridge-root .label { font: 400 8px 'Geist Mono', 'Courier New', monospace; letter-spacing: .48px; fill: #4f5d75; }
      #remote-uart-bridge-root .title { font: 400 28px 'Instrument Serif', Georgia, serif; fill: #2d3142; }
      #remote-uart-bridge-root .note { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4f5d75; }</style>
<marker id="remote-uart-bridge-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#4f5d75"/></marker>
<marker id="remote-uart-bridge-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2e5aa8"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" rx="0" fill="#f5f5f5" stroke="none" />
<text x="40" y="32" class="tag" text-anchor="start">HELLO ZIGBEE WORLD / FIELD GUIDE</text>
<text x="40" y="76" class="title" text-anchor="start">Remote access needs a second controller</text>
<text x="40" y="104" class="copy" text-anchor="start">Source: Hello Zigbee World, part 28 and RemoteLogger. These pins and protocols do not apply to SLZB-06.</text>
