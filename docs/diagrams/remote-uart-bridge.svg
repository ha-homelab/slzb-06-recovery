<text x="408" y="268" class="mono" text-anchor="start">Exclusive UART ownership</text>
<line x1="412" y1="292" x2="564" y2="292" stroke="#bfc0c0" stroke-width="1.2"/>
<text x="408" y="324" class="mono" text-anchor="start">Logger pauses during flashing.</text>
