<text x="752" y="300" class="mono" text-anchor="start">Application: 115200</text>
<text x="752" y="316" class="mono" text-anchor="start">Bootloader: 38400</text>
<text x="752" y="332" class="mono" text-anchor="start">Baud rates are specific</text>
<text x="752" y="348" class="mono" text-anchor="start">to this example.</text>
<text x="40" y="496" class="copy" text-anchor="start">Conceptual NXP bench setup. Separate power and mains isolation are required; this is not a wiring guide.</text>
