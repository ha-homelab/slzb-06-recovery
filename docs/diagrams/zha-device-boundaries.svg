<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="zha-device-boundaries-title zha-device-boundaries-desc" id="zha-device-boundaries-root">
<title id="zha-device-boundaries-title">Four layers, four update boundaries</title>
<desc id="zha-device-boundaries-desc">Home Assistant talks through the ESP32 bridge and CC2652P coordinator to Zigbee devices, each with a separate software or firmware update boundary.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #zha-device-boundaries-root { color: #2d3142; font-family: 'Geist', Arial, sans-serif; }
      #zha-device-boundaries-root .name { font: 600 12px 'Geist', Arial, sans-serif; fill: #2d3142; }
      #zha-device-boundaries-root .copy { font: 400 12px 'Geist', Arial, sans-serif; fill: #4f5d75; }
      #zha-device-boundaries-root .mono { font: 400 9px 'Geist Mono', 'Courier New', monospace; fill: #4f5d75; }
      #zha-device-boundaries-root .tag { font: 500 8px 'Geist Mono', 'Courier New', monospace; letter-spacing: 1px; fill: #4f5d75; }
      #zha-device-boundaries-root .label { font: 400 8px 'Geist Mono', 'Courier New', monospace; letter-spacing: .48px; fill: #4f5d75; }
      #zha-device-boundaries-root .title { font: 400 28px 'Instrument Serif', Georgia, serif; fill: #2d3142; }
      #zha-device-boundaries-root .note { font: italic 14px 'Instrument Serif', Georgia, serif; fill: #4f5d75; }</style>
<marker id="zha-device-boundaries-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#4f5d75"/></marker>
<marker id="zha-device-boundaries-link" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#2e5aa8"/></marker>
</defs>
<rect x="0" y="0" width="960" height="600" rx="0" fill="#f5f5f5" stroke="none" />
<text x="40" y="32" class="tag" text-anchor="start">HELLO ZIGBEE WORLD / FIELD GUIDE</text>
<text x="40" y="76" class="title" text-anchor="start">Four layers, four update boundaries</text>
<text x="40" y="104" class="copy" text-anchor="start">The original SLZB-06 is a network adapter, not the firmware inside every Zigbee device.</text>
<rect x="296" y="168" width="360" height="216" rx="8" fill="#f0f0f0" stroke="#bfc0c0" stroke-dasharray="4,4"/>
<text x="316" y="192" class="tag" text-anchor="start">ORIGINAL SLZB-06 / TWO FIRMWARE TARGETS</text>
<line x1="232" y1="280" x2="320" y2="280" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#zha-device-boundaries-link)"/>
<line x1="448" y1="280" x2="504" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#zha-device-boundaries-arrow)"/>
<line x1="632" y1="280" x2="744" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#zha-device-boundaries-arrow)"/>
<rect x="244" y="252" width="64" height="20" rx="2" fill="#f5f5f5" stroke="none" />
<text x="276.0" y="265" class="label" text-anchor="middle">LAN / TCP</text>
<rect x="454" y="252" width="44" height="20" rx="2" fill="#f5f5f5" stroke="none" />
<text x="476.0" y="265" class="label" text-anchor="middle">UART</text>
<rect x="652" y="252" width="72" height="20" rx="2" fill="#f5f5f5" stroke="none" />
<text x="688.0" y="265" class="label" text-anchor="middle">ZIGBEE</text>
<rect x="40" y="224" width="192" height="120" rx="6" fill="#ffffff" stroke="#2d3142" />
<text x="56" y="248" class="tag" text-anchor="start">HOST SOFTWARE</text>
<text x="56" y="276" class="name" text-anchor="start">Home Assistant / ZHA</text>
<text x="56" y="300" class="mono" text-anchor="start">zigpy + radio driver</text>
<text x="56" y="316" class="mono" text-anchor="start">Network state and entities</text>
<rect x="320" y="224" width="128" height="120" rx="6" fill="#ffffff" stroke="#2d3142" />
<text x="336" y="248" class="tag" text-anchor="start">BRIDGE</text>
<text x="336" y="276" class="name" text-anchor="start">ESP32 core</text>
<text x="336" y="300" class="mono" text-anchor="start">Ethernet / web</text>
<text x="336" y="316" class="mono" text-anchor="start">Serial transport</text>
<rect x="504" y="224" width="128" height="120" rx="6" fill="#f4eae4" stroke="#eb6c36" />
<text x="520" y="248" class="tag" text-anchor="start">COORDINATOR</text>
<text x="520" y="276" class="name" text-anchor="start">CC2652P</text>
<text x="520" y="300" class="mono" text-anchor="start">TI Z-Stack</text>
<text x="520" y="316" class="mono" text-anchor="start">Network state</text>
<rect x="744" y="224" width="176" height="120" rx="8" fill="#eaeaec" stroke="#4f5d75" />
<text x="760" y="248" class="tag" text-anchor="start">DEVICE FIRMWARE</text>
<text x="760" y="276" class="name" text-anchor="start">Light, switch, sensor</text>
<text x="760" y="300" class="mono" text-anchor="start">Clusters and endpoints</text>
<text x="760" y="316" class="mono" text-anchor="start">Device-specific image</text>
<text x="40" y="424" class="name" text-anchor="start">Update Home Assistant</text>
<text x="40" y="448" class="mono" text-anchor="start">Host integration and libraries</text>
<text x="320" y="424" class="name" text-anchor="start">Update core / radio</text>
<text x="320" y="448" class="mono" text-anchor="start">Separate images and procedures</text>
<text x="744" y="424" class="name" text-anchor="start">Update the device</text>
<text x="744" y="448" class="mono" text-anchor="start">Compatible Zigbee OTA or</text>
<text x="744" y="464" class="mono" text-anchor="start">its own recovery tool</text>
<text x="40" y="512" class="note" text-anchor="start">A working web page proves the bridge; a fresh device response checks the full path.</text>
<line x1="40" y1="544" x2="920" y2="544" stroke="#bfc0c0" stroke-width="1.2"/>
<text x="40" y="576" class="tag" text-anchor="start">KEY</text>
<line x1="108" y1="572" x2="140" y2="572" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#zha-device-boundaries-link)"/>
<text x="152" y="576" class="mono" text-anchor="start">Request path (responses return over the same links)</text>
<rect x="580" y="562" width="16" height="16" rx="2" fill="#f4eae4" stroke="#eb6c36" />
<text x="608" y="576" class="mono" text-anchor="start">Coordinator firmware / network state</text>
</svg>
