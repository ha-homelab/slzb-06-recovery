name: Validate tools
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install Home Assistant helper dependency
        run: python3 -m pip install --require-hashes -r requirements-ha.txt
      - name: Unit tests and syntax checks (no hardware)
        run: 'python3 -m unittest discover -s tests -v

          python3 -m compileall -q scripts

          python3 scripts/slzb.py --help

          python3 scripts/radio_legacy.py --help

          python3 scripts/compare_network.py --help

          python3 scripts/ha_zha.py --help

          python3 scripts/esp32_core.py --help

          '
  dependency-locks:
    name: Install ${{ matrix.lock }} without hardware access
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        lock:
          - requirements-core.txt
          - requirements-radio.txt
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Verify the complete locked dependency set
        env:
          LOCK: ${{ matrix.lock }}
        run: 'python -m venv /tmp/locked-tool

          /tmp/locked-tool/bin/python -m pip install --require-hashes -r "$LOCK"

          /tmp/locked-tool/bin/python -m pip check

          '
'on':
  workflow_call:
